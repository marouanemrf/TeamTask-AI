version: 1
# Amplify Hosting build for TeamTask AI (Amplify Gen 2: backend + React/Vite frontend).
# Node 22: Vite 8 needs Node 20.19+ and the default build image may ship an older Node.
backend:
  phases:
    preBuild:
      commands:
        # --skip-default-packages: the build image would otherwise reinstall its own global tools
        # (@aws-amplify/cli, cypress, bower, …) for Node 22 — slow, unused here, and a failure point.
        - nvm install --skip-default-packages 22 && nvm use 22
        # Same npm major as local development: npm 10 (bundled with Node 22) validates the lockfile
        # differently and rejected a lockfile written by npm 11 ("Missing: … from lock file").
        - npm install -g npm@11
        - node --version && npm --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Deploys the branch backend and writes amplify_outputs.json for the frontend build.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
