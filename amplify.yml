version: 1
# Amplify Hosting build for TeamTask AI (Amplify Gen 2: backend + React/Vite frontend).
# Node 22: Vite 8 needs Node 20.19+ and the default build image may ship an older Node.
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Deploys the branch backend and writes amplify_outputs.json for the frontend build.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
